[package]
name = "opterm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A thin native terminal prototype"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fontdb = "0.23"
portable-pty = "0.9"
directories = "6"
interprocess = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
open = "5"
getrandom = "0.4"
arboard = { version = "3", default-features = false }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
egui_extras = { version = "0.33", default-features = false, features = ["svg", "image"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
