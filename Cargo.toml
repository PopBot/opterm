[package]
name = "opterm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A thin native terminal prototype"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
fontdb = "0.23"
portable-pty = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
